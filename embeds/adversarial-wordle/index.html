<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adversarial Wordle</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="game-container">
      <header class="header">
        <h1>Adversarial Wordle</h1>
      </header>

      <main class="game">
        <div class="board">
          <div class="row">
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
          </div>
          <div class="row">
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
          </div>
          <div class="row">
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
          </div>
          <div class="row">
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
          </div>
          <div class="row">
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
          </div>
          <div class="row">
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
          </div>
        </div>

        <div class="keyboard">
          <div class="keyboard-row">
            <button class="key" data-key="Q">Q</button>
            <button class="key" data-key="W">W</button>
            <button class="key" data-key="E">E</button>
            <button class="key" data-key="R">R</button>
            <button class="key" data-key="T">T</button>
            <button class="key" data-key="Y">Y</button>
            <button class="key" data-key="U">U</button>
            <button class="key" data-key="I">I</button>
            <button class="key" data-key="O">O</button>
            <button class="key" data-key="P">P</button>
          </div>
          <div class="keyboard-row">
            <button class="key" data-key="A">A</button>
            <button class="key" data-key="S">S</button>
            <button class="key" data-key="D">D</button>
            <button class="key" data-key="F">F</button>
            <button class="key" data-key="G">G</button>
            <button class="key" data-key="H">H</button>
            <button class="key" data-key="J">J</button>
            <button class="key" data-key="K">K</button>
            <button class="key" data-key="L">L</button>
          </div>
          <div class="keyboard-row">
            <button class="key key-wide" data-key="Enter">ENTER</button>
            <button class="key" data-key="Z">Z</button>
            <button class="key" data-key="X">X</button>
            <button class="key" data-key="C">C</button>
            <button class="key" data-key="V">V</button>
            <button class="key" data-key="B">B</button>
            <button class="key" data-key="N">N</button>
            <button class="key" data-key="M">M</button>
            <button class="key key-wide" data-key="Backspace">⌫</button>
          </div>
        </div>

        <div class="loading-overlay">
          <div class="loading-spinner"></div>
          <div class="loading-text">Thinking...</div>
        </div>

        <div class="stats-screen">
          <div class="stats-container">
            <div class="stats-header">
              <h2>Statistics</h2>
            </div>

            <div class="stats-summary">
              <div class="stat">
                <div class="stat-value" data-stat="totalGames">0</div>
                <div class="stat-label">Played</div>
              </div>
              <div class="stat">
                <div class="stat-value" data-stat="winRate">0</div>
                <div class="stat-label">Win %</div>
              </div>
              <div class="stat">
                <div class="stat-value" data-stat="avgGuesses">0</div>
                <div class="stat-label">Avg Guesses</div>
              </div>
            </div>

            <div class="stats-distribution">
              <h3>Guess Distribution</h3>
              <div class="histogram">
                <div class="histogram-row" data-guess="1">
                  <div class="histogram-label">1</div>
                  <div class="histogram-bar-container">
                    <div class="histogram-bar" data-bar="1">
                      <div class="histogram-count">0</div>
                    </div>
                  </div>
                </div>
                <div class="histogram-row" data-guess="2">
                  <div class="histogram-label">2</div>
                  <div class="histogram-bar-container">
                    <div class="histogram-bar" data-bar="2">
                      <div class="histogram-count">0</div>
                    </div>
                  </div>
                </div>
                <div class="histogram-row" data-guess="3">
                  <div class="histogram-label">3</div>
                  <div class="histogram-bar-container">
                    <div class="histogram-bar" data-bar="3">
                      <div class="histogram-count">0</div>
                    </div>
                  </div>
                </div>
                <div class="histogram-row" data-guess="4">
                  <div class="histogram-label">4</div>
                  <div class="histogram-bar-container">
                    <div class="histogram-bar" data-bar="4">
                      <div class="histogram-count">0</div>
                    </div>
                  </div>
                </div>
                <div class="histogram-row" data-guess="5">
                  <div class="histogram-label">5</div>
                  <div class="histogram-bar-container">
                    <div class="histogram-bar" data-bar="5">
                      <div class="histogram-count">0</div>
                    </div>
                  </div>
                </div>
                <div class="histogram-row" data-guess="6">
                  <div class="histogram-label">6</div>
                  <div class="histogram-bar-container">
                    <div class="histogram-bar" data-bar="6">
                      <div class="histogram-count">0</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="stats-actions">
              <button class="btn btn-outline" data-action="clear-stats">Clear Stats</button>
              <button class="btn btn-primary" data-action="play-again">Play Again</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
